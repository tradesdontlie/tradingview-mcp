name: CI

on:
  push:
    branches: [main, fixes/draw-api-resolve]
  pull_request:
    branches: [main, fixes/draw-api-resolve]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (TV-independent)
        # Pure-logic suite only — excludes e2e.test.js and cli.test.js, which
        # need a live TradingView Desktop + CDP on port 9222 (unavailable in CI).
        run: npm run test:unit:pure

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
