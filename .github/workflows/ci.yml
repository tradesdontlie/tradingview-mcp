name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # test:unit excludes e2e.test.js, which needs a live TradingView Desktop + CDP.
        run: npm run test:unit

      - name: Audit (high severity)
        # Blocking on purpose. A high-severity advisory can appear against a
        # lockfile nobody touched, so an advisory-only step is never seen.
        # --audit-level=high keeps moderate and low findings non-blocking.
        run: npm audit --audit-level=high
