<title>Dual Trend Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#D6DDE6; --line-soft:#E4EAF1;
  --ink:#10151C; --ink-2:#38434F; --muted:#5A6675; --faint:#8593A3;
  --accent:#B4761A; --accent-soft:#F2E3C9; --accent-ink:#7C4F0C;
  --bull:#0E7C5A; --bull-soft:#DCEFE7; --bear:#B4382C; --bear-soft:#F6E0DC;
  --neutral:#5C6B87; --neutral-soft:#E3E8F0;
  --shadow:0 1px 2px rgba(16,21,28,.05),0 8px 24px -16px rgba(16,21,28,.24);
  --r:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1117; --surface:#151B23; --surface-2:#1B222C; --line:#2A3441; --line-soft:#212a35;
    --ink:#E4E9F0; --ink-2:#C2CBD6; --muted:#8794A3; --faint:#68757F;
    --accent:#E0A33E; --accent-soft:#3A2F19; --accent-ink:#F0C77E;
    --bull:#2FB88A; --bull-soft:#12312A; --bear:#E8654F; --bear-soft:#3A211D;
    --neutral:#8397BC; --neutral-soft:#232D3D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1117; --surface:#151B23; --surface-2:#1B222C; --line:#2A3441; --line-soft:#212a35;
  --ink:#E4E9F0; --ink-2:#C2CBD6; --muted:#8794A3; --faint:#68757F;
  --accent:#E0A33E; --accent-soft:#3A2F19; --accent-ink:#F0C77E;
  --bull:#2FB88A; --bull-soft:#12312A; --bear:#E8654F; --bear-soft:#3A211D;
  --neutral:#8397BC; --neutral-soft:#232D3D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,ui-sans-serif,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.014em;font-weight:600}
.mono,.tick,.lbl,td.num,th.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ---------- masthead ---------- */
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;padding:22px 0 18px}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tag{width:9px;height:9px;background:var(--accent);border-radius:1px;flex:none}
h1{font-size:25px;line-height:1.1}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(78px,auto));gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:9px 14px 10px}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.15;display:block;margin-top:3px}
.kpi .d{font-size:10.5px;color:var(--faint);margin-top:1px}
.up{color:var(--bull)} .dn{color:var(--bear)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;gap:2px;overflow-x:auto;padding:0}
.nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.055em;text-transform:uppercase;
  padding:12px 14px;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- panels ---------- */
main{padding:26px 0 72px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.ph h2{font-size:15.5px}
.ph h3{font-size:14px}
.ph .note{font-size:12.5px;color:var(--muted);max-width:70ch}
.pb{padding:16px 18px 18px}
.pb.tight{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:2px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:1px;background:currentColor;flex:none}
.chip.bull{background:var(--bull-soft);color:var(--bull)}
.chip.bear{background:var(--bear-soft);color:var(--bear)}
.chip.neu{background:var(--neutral-soft);color:var(--neutral)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.plain{background:var(--surface-2);color:var(--muted)}
.chip.nodot::before{display:none}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.075em;text-transform:uppercase;
  color:var(--faint);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.num{text-align:right}
.tick{font-weight:600;font-size:12.5px;letter-spacing:.02em}
.co{color:var(--muted);font-size:12px}
.why{color:var(--ink-2);font-size:13px;max-width:60ch}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg select,.fg input{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:2px;min-width:130px}
.fg input{min-width:190px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#1a1206}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{color:#fff}}
.count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);align-self:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  padding:6px 11px;border-radius:2px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- charts ---------- */
svg{display:block;max-width:100%;height:auto}
.axis{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--faint)}
.axis-b{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--muted)}
.gridline{stroke:var(--line-soft);stroke-width:1}
.serieslbl{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500}

/* ---------- misc ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-21px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent)}
.tl-item.bear::before{border-color:var(--bear)}
.tl-item.bull::before{border-color:var(--bull)}
.tl-d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.03em}
.tl-h{font-size:14.5px;font-family:Archivo,sans-serif;font-weight:600;margin:2px 0 3px}
.tl-b{font-size:13px;color:var(--ink-2);max-width:74ch}
.hr{height:1px;background:var(--line-soft);margin:18px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.kv dd{margin:0;color:var(--ink-2)}
.callout{border-left:2px solid var(--accent);background:var(--surface-2);padding:11px 14px;font-size:13.5px;color:var(--ink-2);border-radius:0 2px 2px 0}
.hide{display:none !important}
.bar{height:7px;background:var(--neutral-soft);border-radius:1px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--accent)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:20px 0 40px}
.warn{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  color:var(--accent-ink);padding:10px 14px;border-radius:var(--r);font-size:12.5px;margin-bottom:20px}
</style>
